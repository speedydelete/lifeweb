<!DOCTYPE html>
<html>
    <head>
        <title>Rule Symmetries</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>

* {
    box-sizing: border-box;
}

html, body {
    position: absolute;
    inset: 0;
    height: 100%;
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

button, input:not([type=checkbox]) {
    padding: 3px 6px;
    font-size: inherit;
    background-color: inherit;
    color: inherit;
    border: 1px solid black;
}

input[type=checkbox] {
    border: 1px solid black;
    height: 1.25em;
    width: 1.25em;
}

button {
    font-family: inherit;
}

input {
    font-family: 'Courier New', Courier, monospace;
}

input:focus {
    outline: none;
}

textarea {
    resize: none;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1em;
    overflow-wrap: anywhere;
    overflow-y: auto;
}

textarea:focus {
    outline: none;
}

select {
    font-size: 0.875em;
    padding: 5px;
    appearance: none;
    background-color: #ffffff;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' version='1.1' viewBox='0 0 16 16'><line x1='1' y1='6' x2='6' y2='12' stroke='%23000000' stroke-width='0.85' /><line x1='11' y1='6' x2='6' y2='12' stroke='%23000000' stroke-width='0.85' /></svg>");
    background-repeat: no-repeat;
    background-position: right;
    background-size: 16px;
    color: #000000;
    border: 1px solid #000000;
}

select:focus {
    outline: none;
}

option {
    background-color: #ffffff;
}

#top {
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: start;
    align-items: center;
    gap: 20px;
}

#top > * {
    display: flex;
    flex-direction: row;
    justify-content: start;
    align-items: center;
}

#mode {
    margin-left: 1.5ch;
    width: 24ch;
}

#input {
    margin-left: 1ch;
    width: min(50vw, 67ch);
}

.main {
    flex: 1 1 auto;
    min-height: 0;
}

#main {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.5em;
}

#text-output {
    flex: 1 0 auto;
    cursor: copy;
    font-family: 'Courier New', Courier, monospace;
    white-space: pre-wrap;
}

#list-output {
    min-height: 0;
    max-height: calc(100% - 2.5em);
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: start;
    align-items: start;
    overflow-y: auto;
    overflow-wrap: anywhere;
    font-family: 'Courier New', Courier, monospace;
    white-space: pre-wrap;
}

.basis-vector {
    display: flex;
    flex-direction: row;
    justify-content: start;
    align-items: center;
    gap: 1ch;
}

        </style>
    </head>
    <body spellcheck="false" autocapitalize="" autocorrect="off" writingsuggestions="false">
        <div id="top">
            <div id="mode-wrapper">
                <div>Mode:</div>
                <select id="mode">
                    <option value="basis-of-symmetry">Find basis of symmetry</option>
                    <option value="symmetries-of-rule">Find symmetries of rule</option>
                </select>
            </div>
            <div id="input-wrapper">
                <div id="input-text">Symmetry</div>: <input type="text" id="input" width="50" />
            </div>
        </div>
        <div class="main" id="main">
            <div id="text-output"></div>
            <div id="list-output"></div>
        </div>

    </body>
</html>
